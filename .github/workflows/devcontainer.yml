name: Release Dev Container

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
    paths-ignore:
      - '.devcontainer/devcontainer.json'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: SemVer-Tag prüfen
        if: github.ref_type == 'tag'
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Ungültiges Release-Tag: $GITHUB_REF_NAME"
            exit 1
          fi
 
      - name: Bei GHCR anmelden
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.CR_PAT }}
 
      - name: Docker-Metadaten erzeugen
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/flycaptainrex/tictactest-devcontainer
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=stable

      - name: Devcontainer bauen und pushen
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .devcontainer/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  update-devcontainer-reference:
    needs: build-and-push-image
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Devcontainer-Version aktualisieren
        id: update-image
        env:
          IMAGE_TAG: sha-${GITHUB_SHA::7}
        run: |
          IMAGE="ghcr.io/flycaptainrex/tictactest-devcontainer:${IMAGE_TAG}"
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          jq --arg image "$IMAGE" '.image = $image' .devcontainer/devcontainer.json > .devcontainer/devcontainer.json.tmp
          mv .devcontainer/devcontainer.json.tmp .devcontainer/devcontainer.json
          for workflow in .github/workflows/*.yml .github/workflows/*.yaml; do
            [ -f "$workflow" ] || continue
            [ "$workflow" = ".github/workflows/devcontainer.yml" ] && continue
            sed -i -E "s#ghcr.io/flycaptainrex/tictactest-devcontainer:[^[:space:]]+#${IMAGE}#g" "$workflow"
          done

      - name: Pull Request erstellen
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: chore/update-devcontainer-image
          delete-branch: true
          commit-message: "chore: update devcontainer image to ${{ steps.update-image.outputs.image_tag }}"
          title: "chore: update devcontainer image to ${{ steps.update-image.outputs.image_tag }}"
          body: |
            Das Devcontainer-Image wurde nach erfolgreichem Build nach GHCR gepusht.

            Dieser PR aktualisiert `.devcontainer/devcontainer.json` und die CI-Workflows auf `ghcr.io/flycaptainrex/tictactest-devcontainer:${{ steps.update-image.outputs.image_tag }}`.